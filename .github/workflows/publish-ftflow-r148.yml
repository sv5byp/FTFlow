name: Publish reviewed FTflow r148
on:
  push:
    branches: [main]
    paths: ['.release/r148/manifest.json']
permissions:
  contents: write
concurrency:
  group: ftflow-release-r148
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sv5byp/FTFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify reviewed files and publish FTflow r148
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, urllib.request, urllib.error, urllib.parse, zlib
          from concurrent.futures import ThreadPoolExecutor
          repo = 'sv5byp/FTFlow'
          tag = 'r148'
          expected = [{'name': 'FTflow-SV5BYP-r148-source.zip', 'sha256': 'b7c8250231664130d57ac4da7c1b832a9cf9c472b5d61c7673b677273ea3683f', 'size': 31776300}, {'name': 'FTflow-SV5BYP-r148-Windows-x64-portable.zip', 'sha256': '4bc40073250b438fa9ed253ffbb39d97070fd1fc82dbe56a91d6be7b6514c5d1', 'size': 43683311}, {'name': 'FTFlow-update.bin', 'sha256': 'd970d69886bfe5c241f352649cd63c723b6e943d8a4cdf7955e9fb8a4550df79', 'size': 31733835}, {'name': 'FTFlow-update.sig', 'sha256': '2b2466042b9ec4b2389e5224264fe5521e5279fea6c958a95947190093ba1957', 'size': 384}]
          assert os.environ['GITHUB_REPOSITORY'] == repo
          commit = os.environ['GITHUB_SHA']
          assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
          base = 'https://raw.githubusercontent.com/' + repo + '/' + commit + '/.release/r148/'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def download(path, limit):
              request = urllib.request.Request(base + urllib.parse.quote(path), headers={'User-Agent':'FTflow-Release-r148'})
              with urllib.request.urlopen(request, timeout=45) as response: data = response.read(limit + 1)
              assert len(data) <= limit
              return data
          data = download('manifest.json', 100000)
          assert digest(data) == '1eb366f1b4b798c87ee3d37fe5d3c073f1cb22b531ffcac6070be355a8369a50'
          manifest = json.loads(data)
          assert manifest['repository'] == repo and manifest['tag'] == tag
          assert [{k:a[k] for k in ('name','sha256','size')} for a in manifest['assets']] == expected
          def read_part(part):
              assert part['path'].startswith('chunks/') and '..' not in part['path']
              data = download(part['path'], part['size'])
              assert len(data) == part['size'] and digest(data) == part['sha256']
              return data
          files = {}
          with ThreadPoolExecutor(max_workers=8) as executor:
              for asset in manifest['assets']:
                  data = b''.join(executor.map(read_part, asset['chunks']))
                  if asset['transport'] == 'zlib':
                      decoder = zlib.decompressobj()
                      data = decoder.decompress(data, asset['size'] + 1)
                      assert decoder.eof and not decoder.unused_data
                  else: assert asset['transport'] == 'raw'
                  assert len(data) == asset['size'] and digest(data) == asset['sha256']
                  files[asset['name']] = data
          print('Verified all four reviewed release assets.')
          def api(method, path, payload=None, raw=False):
              url = path if path.startswith('https://uploads.github.com/') else 'https://api.github.com/repos/' + repo + path
              data = payload if raw else None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                  'User-Agent':'FTflow-Release-r148', 'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/octet-stream' if raw else 'application/json'})
              with urllib.request.urlopen(request, timeout=180) as response: return json.load(response)
          try: release = api('GET','/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api('POST','/releases',{'tag_name':tag,'target_commitish':commit,
                  'name':manifest['title'],'body':manifest['body'],'draft':True,'prerelease':False})
          assert release['tag_name'] == tag and not release['prerelease']
          existing = {a['name']:a for a in release['assets']}
          assert set(existing).issubset(files), 'Unexpected release assets; refusing to modify them'
          for asset in expected:
              if asset['name'] not in existing:
                  assert release['draft'], 'Refusing to alter a published partial release'
                  url = 'https://uploads.github.com/repos/' + repo + '/releases/' + str(release['id']) + '/assets?name=' + urllib.parse.quote(asset['name'])
                  existing[asset['name']] = api('POST',url,files[asset['name']],raw=True)
              uploaded = existing[asset['name']]
              assert uploaded['size'] == asset['size'] and uploaded['digest'] == 'sha256:' + asset['sha256']
          if release['draft']:
              release = api('PATCH','/releases/' + str(release['id']),{'draft':False,'prerelease':False,'make_latest':'true'})
          assert not release['draft'] and not release['prerelease']
          print('Published ' + release['html_url'])
          PY
